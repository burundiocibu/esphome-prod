substitutions:
  me: oak-fae

esphome:
  name: ${me}
  comment: seeed xiao
  on_boot:
    priority: 800
    then:
      - lambda: |-
          for (gpio_num_t pin : {GPIO_NUM_3, GPIO_NUM_14}) {
            gpio_reset_pin(pin);
            gpio_set_direction(pin, GPIO_MODE_OUTPUT);
            gpio_set_level(pin, 0);
            gpio_hold_en(pin);
          }

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:

api:
  encryption:
    key: !secret esp_api_key

ota:
  - platform: esphome
    encryption:
    id: my_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:

sensor:
  - platform: uptime
    name: ${me} uptime
    update_interval: 120s

output:
  - platform: ledc
    id: pina
    pin: GPIO23
    frequency: 500
  - platform: ledc
    id: pinb
    pin: GPIO16
    frequency: 500

light:
  - platform: hbridge
    name: ${me} lights
    pin_a: pina
    pin_b: pinb

  
    