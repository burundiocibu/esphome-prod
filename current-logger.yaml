# https://learn.adafruit.com/esp32-s3-reverse-tft-feather/pinouts
substitutions:
  me: current-logger

esphome:
  name: ${me}
  comment: adafruit esp32-s3-reverse-tft-feather
  on_boot: 
    then:
      - output.turn_on: tfti2c_pwr
      - output.turn_on: tft_backlight

esp32:
  board: adafruit_feather_esp32s3_tft
  framework:
    type: esp-idf
    
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: info

api:
  encryption:
    key: !secret esp_api_key

ota:
  - platform: esphome
    encryption:

prometheus:

web_server:
  version: 3

time:
  - platform: homeassistant
    timezone: America/Chicago

text_sensor:
  - platform: version
    name: ESPHome Version

switch:
  - platform: restart
    name: restart

globals:
  - id: counters_reset_ms
    type: uint32_t
    initial_value: '0'

button:
  - platform: template
    name: "Reset counters"
    id: reset_counters
    on_press:
      - lambda: |-
          id(ina288).reset_energy_counters();
          id(counters_reset_ms) = millis();
      - component.update: since_reset

i2c:
  sda: GPIO3
  scl: GPIO4

spi:
  clk_pin: GPIO36
  mosi_pin: GPIO35
  miso_pin: GPIO37

output:
  - platform: gpio
    pin: GPIO7
    id: tfti2c_pwr

  - platform: gpio
    pin: GPIO45
    id: tft_backlight
  
  - platform: gpio
    pin: GPIO13
    id: led

binary_sensor:
  - platform: gpio
    pin: GPIO1
    id: D1_button
  - platform: gpio
    pin: GPIO2
    id: D2_button
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    id: D0_button
    filters:
      - delayed_on: 20ms
    on_press:
      - button.press: reset_counters

sensor:
  - platform: uptime
    name: uptime
    update_interval: 120s

  - platform: template
    name: time since reset
    id: since_reset
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return (millis() - id(counters_reset_ms)) / 1000.0f;"

  - platform: template
    name: mean current since reset
    id: mean_current
    unit_of_measurement: mA
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      float elapsed_s = (millis() - id(counters_reset_ms)) / 1000.0f;
      if (elapsed_s < 1.0f || std::isnan(id(charge).state))
        return NAN;
      // charge is in Ah
      return id(charge).state * 3600.0f * 1000.0f / elapsed_s;

  - platform: wifi_signal
    name: wifi signal
    update_interval: 15s

  - platform: ina2xx_i2c
    address: 0x40
    model: INA228
    shunt_resistance: 0.015 ohm
    max_current: 10A
    update_interval: 1s
    id: ina288
    current:
      name: current
      id: ina_current
      accuracy_decimals: 3
      unit_of_measurement: mA
      filters:
        - multiply: 1000

    power:
      name: power
      id: ina_power

    bus_voltage:
      name: bus voltage
      id: buss_v
      accuracy_decimals: 4

    shunt_voltage:
      name: shunt voltage
      accuracy_decimals: 6

    energy: 
      name: energy
      id: energy
      accuracy_decimals: 6

    charge:
      name: charge
      id: charge
      accuracy_decimals: 8
        
    temperature: 
      name: ina temperature
      accuracy_decimals: 2

  - platform: max17043
    address: 0x36
    battery_voltage:
      name: battery voltage
      id: battery_voltage
    battery_level:
      name: battery level
      id: battery_level

color:
  - id: red
    red: 100%
    green: 0%
    blue: 0%
  - id: green
    red: 0%
    green: 100%
    blue: 0%
  - id: blue
    red: 0%
    green: 0%
    blue: 100%
  - id: yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: white
    red: 100%
    green: 100%
    blue: 100%

font:
  - file: "gfonts://Roboto"
    id: roboto_14
    size: 14
    bpp: 4

  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18
    bpp: 4

display:
  - platform: mipi_spi
    model: T-DISPLAY
    dc_pin: GPIO40
    reset_pin: GPIO41
    cs_pin: GPIO42
    rotation: 270
    update_interval: 1s
    lambda: |-
      it.printf(1, 0, id(roboto_18), id(white), "current: %.1f, %.2f mA avg",
          id(ina_current).state, id(mean_current).state);
      it.printf(1, 20, id(roboto_18), id(white), "voltage: %6.2f V",
          id(buss_v).state);
      it.printf(1, 40, id(roboto_18), id(white), "energy: %6.2f Wh",
          id(energy).state);
      unsigned elapsed_s = (millis() - id(counters_reset_ms)) / 1000;
      it.printf(1, 60, id(roboto_18), id(white), "elapsed: %u:%02u:%02u",
          elapsed_s / 3600, (elapsed_s / 60) % 60, elapsed_s % 60);
      it.printf(1, 80, id(roboto_18), id(white), "battery: %3.1f %% , %4.2f V",
          id(battery_level).state, id(battery_voltage).state);

