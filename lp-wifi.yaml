substitutions:
  me: lp-wifi

esphome:
  name: ${me}
  comment: seeed xiao esp32c6
  loop_interval: 1s
  on_boot:
    # XIAO C6 RF switch: GPIO3 low powers it, GPIO14 low selects the onboard antenna.
    # Hold them so light sleep with power_down_peripherals can't release them.
    priority: 800
    then:
      - lambda: |-
          for (gpio_num_t pin : {GPIO_NUM_3, GPIO_NUM_14}) {
            gpio_reset_pin(pin);
            gpio_set_direction(pin, GPIO_MODE_OUTPUT);
            gpio_set_level(pin, 0);
            gpio_hold_en(pin);
          }

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: HIGH

api:
  encryption:
    key: !secret esp_api_key

ota:
  - platform: esphome
    encryption:
      key: !secret esp_api_key
    id: my_ota

web_server:
  version: 3

prometheus:

power_management:
  - platform: esp32_power_management
    id: pm_id
    enable_light_sleep: true
    power_down_flash: true
    power_down_peripherals: true
    profiling: true

switch:
  - platform: restart
    name: restart

sensor:
  - platform: uptime
    name: ${me} uptime
    update_interval: 15s
  - platform: wifi_signal
    name: ${me} wifi signal
    update_interval: 15s
  - platform: adc
    pin: GPIO0
    name: ${me} battery voltage
    attenuation: 12db
    samples: 8
    update_interval: 60s
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
