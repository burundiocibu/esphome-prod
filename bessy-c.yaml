substitutions:
  me: "bessy-c"

  # Smoker state machine states (smoker_state global; see sc_set_state)
  st_off: 0        # idle -- fan, auger, igniter off
  st_lighting: 1   # sc_light_pot running
  st_heating: 2    # sc_pot_heating running (PID auger cycling)
  st_cooldown: 3   # go off, fan held on until the chamber drops below fan_cooldown_temp_f
  st_safe: 4       # latched firepot fault

  # Fan cooldown tuning (fan interlock, go.on_turn_off, sc_shutdown, hot-start check).
  # Driven by cooldown_temp_f: the fire pot thermocouple, with the chamber PT100 as a
  # backstop if it drops out.
  fan_cooldown_temp_f: "160.0f"    # fan stays on until the chamber drops below this
  fan_cooldown_interval_s: "60"  # seconds between sc_shutdown re-checks

  # Igniter health. A sound element draws ~1.6 A at ~121 V (about 76 ohm); anything
  # under igniter_min_current with the relay closed is an open element, a dead relay
  # or a loose wire. ct_clamp integrates 200 ms every 5 s, so the sample that straddles
  # the relay closing reads low (it is the ~0.4 A / "300 ohm" spike in Grafana) --
  # igniter_settle_ms drops it.
  igniter_min_current: "1.0f"
  igniter_settle_ms: "6000"
  igniter_stale_ms: "120000"   # no valid current reading for this long -> flag the sensor

  # Auger duty cycle: sc_pot_heating runs the auger for auger_feed_rate of each
  # cycle of this length.
  auger_cycle_s: "15.0"
  # The PID's 0-1 output is scaled onto this feed-rate range. The floor keeps the
  # fire fed while the chamber is over temperature; full feed is for grilling.
  # Changing the range changes the loop gain: rescale pid_kp/ki/kd by old/new span.
  auger_feed_min: "0.05"
  auger_feed_max: "1.0"
  # PID autotune hysteresis, in C: the chamber must pass the setpoint by this much
  # before the autotuner switches the feed, so flame noise can't cause false swings.
  pid_autotune_noiseband: "1.0"
  # Autotune "feed high" PID output. Tuning matters for smoking (200-275 F), where
  # feed runs well under full. At feed 0.80 the chamber heated in ~2.5 min but took
  # ~8 min to cool at the floor, and the autotuner flagged the result as unreliable.
  # About twice the steady-state output (~0.15, feed ~0.2 at 225 F) evens them out.
  pid_autotune_high_output: "0.3"

  # Set-temperature range, and encoder steps: 5 F below set_temp_coarse_from, 25 F
  # at and above it.
  set_temp_min_f: "160"
  set_temp_max_f: "550"
  set_temp_coarse_from: "250.0f"

  # I/O assignments -- from hardware/bessy-c KiCad schematic (U1 = UM ProS3, ESP32-S3).
  pin_spi_clk:  GPIO14  # net spi_clk
  pin_spi_miso: GPIO16  # net spi_miso
  pin_spi_mosi: GPIO15  # net spi_mosi
  pin_tft_cs:   GPIO39  # net tft_cs
  pin_tft_dc:   GPIO44  # net tft_dc (ProS3 silkscreen "RX")
  pin_tft_rst:  GPIO38  # net tft_rst
  pin_tft_bl:   GPIO4   # net tft_bl
  pin_ctc_int:  GPIO35  # net ctc_int (bodge wire, J7 pin 2)
  pin_ctc_rst:  GPIO37  # net ctc_rst (bodge wire, J7 pin 4)
  pin_i2c_sda:  GPIO21  # net i2c_sda
  pin_i2c_scl:  GPIO5   # net i2c_scl
  pin_enc_a:    GPIO1   # net enc_a
  pin_enc_b:    GPIO2   # net enc_b
  pin_enc_sw:   GPIO3   # net enc_sw
  pin_relay1:   GPIO42  # net auger
  pin_relay2:   GPIO41  # net fan
  pin_relay3:   GPIO40  # net igniter

esphome:
  name: ${me}
  friendly_name: ${me}
  comment: bessy-c r1
  on_boot:
    priority: -100
    then:
      # NAU7802 PGA bypass (REG 0x1B bit 4). The PGA needs its inputs at least 1.5 V
      # above AVSS, but the chamber PT100 input sits at 0-0.1 V. Runs after the
      # driver's register reset; its later 0x1B update only clears bit 6.
      - lambda: 'id(chamber_raw)->reg(0x1B) |= 0x10;'
      # Publishes "Ready" via the state machine. The hot-start check lives in
      # cooldown_temp_f.on_value: at this point no sensor has published yet, so a
      # temperature check here would always see NAN.
      - script.execute:
          id: sc_set_state
          new_state: ${st_off}

esp32:
  board: um_pros3
  variant: esp32s3
  framework:
    type: esp-idf

# UM ProS3: 8MB QSPI PSRAM. Holds the full-frame display buffer.
psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO
  logs:
    ads1115: INFO
    ads1115.sensor: INFO

globals:
  # Timestamp (millis) of the last user input; drives the Asleep inactivity timeout.
  - id: last_activity_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Set by the PID Autotune button; cleared once the result is copied to pid_kp/ki/kd.
  - id: pid_autotune_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # auger_feed_rate latched at the start of the current sc_pot_heating cycle.
  - id: auger_cycle_rate
    type: float
    restore_value: no
    initial_value: '0.0'
  # Timestamp (millis) of the last wake; a brief grace window after this swallows
  # the extra encoder detents that a single wake gesture emits.
  - id: wake_lockout_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Smoker state machine state (one of the st_* substitution values). Single
  # source of truth for control logic; status_msg is derived from it (and from
  # display_asleep) exclusively by sc_set_state.
  - id: smoker_state
    type: int
    restore_value: no
    initial_value: '0'
  # Display overlay: true while the screen is blanked by the inactivity timer.
  # Orthogonal to smoker_state; user inputs check this to decide wake-vs-act.
  - id: display_asleep
    type: bool
    restore_value: no
    initial_value: 'false'
  # One-shot guard for the hot-start check in cooldown_temp_f.on_value: the first
  # valid (non-NAN) temperature reading after boot decides whether we rebooted
  # into a hot smoker. (Formerly a millis() < 30s window, but sensor pipelines
  # plus boot/setup time can exceed that before the first value arrives.)
  - id: hot_start_checked
    type: bool
    restore_value: no
    initial_value: 'false'
  # Timestamp (millis) lit_sense_f first dropped below the lit threshold during heating.
  - id: pot_below_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Timestamp (millis) of the last valid igniter_current reading; 0 until the first.
  - id: igniter_current_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Igniter current accumulator: summed over one on-window, averaged at turn-off.
  - id: igniter_on_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: igniter_sum_a
    type: float
    restore_value: no
    initial_value: '0.0f'
  - id: igniter_samples
    type: uint16_t
    restore_value: no
    initial_value: '0'
  # lit_sense_f (F) captured when lighting began. "Lit" is a rise above this baseline
  # rather than an absolute value, so it works from a cold or a sun-warmed start.
  - id: lighting_start_temp_f
    type: float
    restore_value: no
    initial_value: '0.0f'

api:
  encryption:
    key: !secret esp_api_key

ota:
  - platform: esphome
    password: !secret esp_ota_pw
    id: my_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${me} Fallback Hotspot
    password: "n84gt5ei4aAb"

captive_portal:

web_server:
  port: 80
  version: 2

prometheus:

# ===================== Buses =====================
spi:
  clk_pin: ${pin_spi_clk}
  miso_pin: ${pin_spi_miso}
  mosi_pin: ${pin_spi_mosi}

i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true
  frequency: 10kHz # the MCP9600 likes it _slow_

# ===================== Display =====================
output:
  - platform: ledc
    pin: ${pin_tft_bl}
    id: tft_backlight

  # smoker_pid's heat output. min_power/max_power scale its 0-1 onto the feed range;
  # with zero_means_zero off, a PID output of 0 still feeds at auger_feed_min.
  - platform: template
    id: auger_feed_output
    type: float
    min_power: ${auger_feed_min}
    max_power: ${auger_feed_max}
    write_action:
      - lambda: id(auger_feed_rate).publish_state(state);

climate:
  # Chamber temperature controller. sc_set_state puts it in HEAT only while the
  # smoker is HEATING; the rest of the time it is OFF and the auger is left to the
  # lighting sequence. The target is the smoker set temperature.
  - platform: pid
    id: smoker_pid
    name: "Smoker"
    sensor: smoker_temp
    default_target_temperature: 225°F
    heat_output: auger_feed_output
    visual:
      min_temperature: ${set_temp_min_f}°F
      max_temperature: ${set_temp_max_f}°F
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    control_parameters:
      kp: 0.0096
      ki: 0.000034
      kd: 1.82
      min_integral: 0.0
      max_integral: 1.0
      derivative_averaging_samples: 3

light:
  - platform: monochromatic
    name: "Display Backlight"
    id: display_backlight
    output: tft_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 22
  - file: "gfonts://Roboto"
    id: roboto_pot
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_big
    size: 60
  # Material Design Icons, three glyphs only -- the whole font is ~7000 icons, so
  # the glyph list is what keeps it small. Codepoints from the MDI metadata:
  # fan F0210, grain F0D7C (auger), heating-coil F1AAF (igniter).
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icons
    size: 36
    glyphs: ["\U000F0210", "\U000F0D7C", "\U000F1AAF"]

display:
  - platform: mipi_spi
    id: my_display
    model: ST7796
    rotation: 270
    cs_pin: ${pin_tft_cs}
    dc_pin: ${pin_tft_dc}
    reset_pin: ${pin_tft_rst}
    update_interval: 1s
    invert_colors: true  # this IPS panel needs INVON to show true colors
    color_depth: 16BIT   # full-frame buffer (480x320x2 = 300KB) lives in PSRAM
    data_rate: 80MHz
    lambda: |-
      auto fg = Color(255, 255, 255);
      auto bg = Color(0, 0, 0);
      auto red = Color(255, 0, 0);

      it.fill(bg);

      it.print(10, 6, id(roboto), fg, TextAlign::TOP_LEFT, id(status_msg).state.c_str());

      // Relay state, left to right: fan, igniter, auger. Lit when on, dim when off;
      // the igniter glows red because it is the one that is actually hot.
      auto dim = Color(70, 70, 70);
      it.print(14, 44, id(icons), id(fan).state ? fg : dim, TextAlign::TOP_LEFT, "\U000F0210");
      it.print(62, 44, id(icons), id(igniter).state ? red : dim, TextAlign::TOP_LEFT, "\U000F1AAF");
      it.print(110, 44, id(icons), id(auger).state ? fg : dim, TextAlign::TOP_LEFT, "\U000F0D7C");

      it.printf(470, 6, id(roboto_pot), red, TextAlign::TOP_RIGHT, "%.0f F", id(pot_temp).state * 1.8f + 32.0f);

      it.printf(240, 70, id(roboto_big), fg, TextAlign::TOP_CENTER, "%.0f F", id(smoker_pid).target_temperature * 1.8f + 32.0f);
      it.printf(240, 160, id(roboto_big), fg, TextAlign::TOP_CENTER, "%.0f F", id(smoker_temp).state * 1.8f + 32.0f);

      it.printf(80, 280, id(roboto), fg, TextAlign::TOP_CENTER, "%.0f F", id(probe3_temp).state * 1.8f + 32.0f);
      it.printf(240, 280, id(roboto), fg, TextAlign::TOP_CENTER, "%.0f F", id(probe2_temp).state * 1.8f + 32.0f);
      it.printf(400, 280, id(roboto), fg, TextAlign::TOP_CENTER, "%.0f F", id(probe1_temp).state * 1.8f + 32.0f);

touchscreen:
  - platform: ft63x6
    id: my_touch
    # Not routed on the r1 board -- bodge-wired from J7. With RST floating the
    # controller never answered at 0x38 (likely held in reset).
    interrupt_pin: ${pin_ctc_int}
    reset_pin: ${pin_ctc_rst}
    on_touch:
      - if:
          condition:
            lambda: 'return id(display_asleep);'
          then:
            # Asleep: swallow the touch, just wake the display
            - script.execute: sc_wake
          else:
            - lambda: |-
                id(last_activity_ms) = millis();
                ESP_LOGI("touch", "Touch at x=%d, y=%d", touch.x, touch.y);

# ADS1115 hubs. ads_hub_ntc: default address (ADDR->GND = 0x48), feeds the NTC
# probes below (AIN3 is unconnected on bessy-c). ads_hub_current: second ADS1115 (U6, hardware/bessy-c), ADDR pulled
# to +3.3V = 0x49, dedicated to the igniter current-sense channel.
ads1115:
  - id: ads_hub_ntc
    address: 0x48
  - id: ads_hub_current
    address: 0x49
    # 2026-09-25: this hub stopped answering conversion reads the moment the igniter
    # relay closed and stayed silent for 46 hours (igniter_current NAN throughout)
    # until a reboot, while the MCP9600 on the same bus kept working. Possibly an
    # interaction between the chip and the ESPHome driver rather than the chip alone:
    # in continuous mode the driver writes the config register once at setup and never
    # again, so nothing re-initialises it, and a failed read is only ever retried as-is.
    # igniter_current_stale exists so the next occurrence is not silent.
    # Only one channel on this hub, so the ADC can free-run: each ct_clamp sample
    # is then just a result read, with no config write to start a conversion.
    continuous_mode: true

# ===================== Sensors =====================
text_sensor:
  - platform: version
    name: ${me} ESPHome Version

  - platform: template
    name: "Status Message"
    id: status_msg

sensor:
  - platform: uptime
    name: ${me} uptime
    update_interval: 120s

  # MCP9600 thermocouple amp on shared I2C bus (MAX31855 SPI didn't play nice with the display)
  - platform: mcp9600
    update_interval: 5s
    address: 0x60
    hot_junction:
      name: "Pot Temperature"
      id: pot_temp
      device_class: temperature
      state_class: measurement
      # Calibrated 2026-09-24 with the replacement probe (ice bath 0 C, boiling
      # 99.04 C at 979.88 hPa): it read 48 F and 196 F. That is a 20% span error,
      # which is a lot for a K-type probe -- see if it holds on the next cal run.
      filters:
        - calibrate_linear:
            - 8.89 -> 0.0
            - 91.11 -> 99.04
    cold_junction:
      id: tc_ref_temp
      name: tc_ref_temp
      device_class: temperature
      state_class: measurement

  # ADS1115 — single-ended channels A0..A2 (referenced to GND), one per NTC probe
  # terminal: A0 = J2 "probe1", A1 = J3 "probe2", A2 = J4 "probe3".
  # 100kΩ NTC thermistors via 47kΩ bias resistor (3.3V → R4/R5/R6 47kΩ → node → NTC → GND)
  - platform: ads1115
    id: ads_a0
    ads1115_id: ads_hub_ntc
    multiplexer: A0_GND
    gain: 4.096
    sample_rate: 128
    update_interval: 0.25s      # fast reads (~9ms each) to feed firmware averaging
    filters:
      # De-spike, then boxcar-average ~20 samples -> one clean value every ~5s.
      - median:
          window_size: 5
          send_every: 5
      - sliding_window_moving_average:
          window_size: 4
          send_every: 4

  - platform: ads1115
    id: ads_a1
    ads1115_id: ads_hub_ntc
    multiplexer: A1_GND
    gain: 4.096
    sample_rate: 128
    update_interval: 0.25s      # fast reads (~9ms each) to feed firmware averaging
    filters:
      # De-spike, then boxcar-average ~20 samples -> one clean value every ~5s.
      - median:
          window_size: 5
          send_every: 5
      - sliding_window_moving_average:
          window_size: 4
          send_every: 4

  - platform: ads1115
    id: ads_a2
    ads1115_id: ads_hub_ntc
    multiplexer: A2_GND
    gain: 4.096
    sample_rate: 128
    update_interval: 0.25s      # fast reads (~9ms each) to feed firmware averaging
    filters:
      # De-spike, then boxcar-average ~20 samples -> one clean value every ~5s.
      - median:
          window_size: 5
          send_every: 5
      - sliding_window_moving_average:
          window_size: 4
          send_every: 4

  # Chamber PT100 on J5, read by the NAU7802 (U5, 0x2A) on channel 1:
  # AVDD → R19 (3.3k) → J5.1/VIN1P → PT100 → J5.2/VIN1N → GND. The r1 board has no
  # J5.2-to-GND connection (J5.2 only reaches VIN1N via R17), so it needs a bodge wire.
  # AVDD is also the ADC reference (REFP), and the PGA is bypassed in on_boot, so full
  # scale is ±0.5 * AVDD and counts / 2^24 = R / (R19 + R).
  - platform: nau7802
    id: chamber_raw
    name: chamber_raw
    gain: 1   # PGA is bypassed, so this has no effect
    ldo_voltage: 3.0V
    samples_per_second: 10
    update_interval: 1s
    filters:
      - median:
          window_size: 5
          send_every: 5

  # NTC temperature sensors — Beta equation: β=3950, R0=100kΩ @ 25°C, R_bias=47kΩ
  # T(K) = 1 / (1/298.15 + ln(R_ntc/100000) / 3950)
  - platform: template
    name: "Probe 1"      # J2
    id: probe1_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float v = id(ads_a0).state;
      if (v <= 0.0f || v >= 3.2f) return NAN;
      float r = 47000.0f * v / (3.3f - v);
      return 1.0f / (1.0f / 298.15f + logf(r / 89689.0f) / 3891.4f) - 273.15f;

  - platform: template
    name: "Probe 2"      # J3
    id: probe2_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      // Calibrated 2026-09-13 (ice 0 °C, boiling 99.04 °C at 979.88 hPa): the nominal
      // β=3950 / R25=100k read 36.35 F and 214.7 F. The fit also absorbs 3.3 V rail and
      // 47k tolerance, so it belongs to the probe plugged into J3.
      float v = id(ads_a1).state;
      if (v <= 0.0f || v >= 3.2f) return NAN;
      float r = 47000.0f * v / (3.3f - v);
      return 1.0f / (1.0f / 298.15f + logf(r / 89689.0f) / 3891.4f) - 273.15f;

  - platform: template
    name: "Probe 3"      # J4
    id: probe3_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float v = id(ads_a2).state;
      if (v <= 0.0f || v >= 3.2f) return NAN;
      float r = 47000.0f * v / (3.3f - v);
      return 1.0f / (1.0f / 298.15f + logf(r / 89689.0f) / 3891.4f) - 273.15f;

  # Chamber PT100 temperature — Callendar-Van Dusen inverse (IEC 60751, T ≥ 0°C)
  # x = R / (R19 + R) from the ratiometric NAU7802 reading; R = R19 * x / (1 - x) - R_off;
  # then solve quadratic B*T² + A*T + (1 - R/R0) = 0
  # Calibrated 2026-09-13: ice bath (0 °C) = 502011 counts, boiling = 677610 counts at
  # 979.88 hPa (99.04 °C, IAPWS-IF97). Solving R19 * x/(1-x) - R_off = R_PT100(T) at both
  # points gives R19 = 3392.27 Ω, R_off = 4.635 Ω.
  - platform: template
    name: "Smoker Temperature"
    id: smoker_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float x = id(chamber_raw).state / 16777216.0f;
      // ~50 Ω to ~365 Ω; an open probe clips at x = 0.5, a short reads ~0
      if (isnan(x) || x < 0.015f || x > 0.1f) return NAN;
      // Two-point calibration (see comment above): effective R19, and an offset that
      // absorbs lead resistance plus the NAU7802's uncalibrated offset error.
      const float r_ref = 3392.27f;
      const float r_off = 4.635f;
      float r = r_ref * x / (1.0f - x) - r_off;
      const float A = 3.9083e-3f;
      const float B = -5.775e-7f;
      const float R0 = 100.0f;
      float disc = A * A - 4.0f * B * (1.0f - r / R0);
      if (disc < 0.0f) return NAN;
      return (-A + sqrtf(disc)) / (2.0f * B);

  # smoker_pid internals, for tuning. The pid sensor publishes every value x100.
  # Error is converted back to F; the terms and result are in percent of the PID's
  # 0-1 output, before auger_feed_output scales it to a feed rate.
  - platform: pid
    climate_id: smoker_pid
    name: "PID Error"
    type: ERROR
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - multiply: 0.018   # C x100 -> F
  - platform: pid
    climate_id: smoker_pid
    name: "PID Result"
    type: RESULT
    unit_of_measurement: "%"
    accuracy_decimals: 1
  - platform: pid
    climate_id: smoker_pid
    name: "PID Proportional"
    type: PROPORTIONAL
    unit_of_measurement: "%"
    accuracy_decimals: 1
  - platform: pid
    climate_id: smoker_pid
    name: "PID Integral"
    type: INTEGRAL
    unit_of_measurement: "%"
    accuracy_decimals: 1
  - platform: pid
    climate_id: smoker_pid
    name: "PID Derivative"
    type: DERIVATIVE
    unit_of_measurement: "%"
    accuracy_decimals: 1

  # Fire pot "lit" sensing, in F. Everything that decides whether the pot is lit --
  # sc_light_pot's check, firepot_monitor, the Safe Mode watchdog -- reads this, so
  # moving to another sensor is a one-line change in the lambda. Currently the
  # thermocouple beside the fire pot; the alternatives are left commented below.
  - platform: template
    name: "Lit Sense Temperature"
    id: lit_sense_f
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float c = id(pot_temp).state;                     // thermocouple beside the pot
      // A dead or disconnected amp reads far outside anything the pot can do; NaN
      // here stalls the watchdog timer, which trips Safe Mode -- the intent.
      if (isnan(c) || c < -20.0f || c > 1000.0f) return NAN;
      return c * 1.8f + 32.0f;
      // return id(smoker_temp).state * 1.8f + 32.0f;   // chamber PT100
      // return id(probe1_temp).state * 1.8f + 32.0f;   // exhaust NTC (J2)

  # What the cooldown logic watches, in F. Cooldown runs the fan to burn off the
  # pellets left in the fire pot, so this is the pot thermocouple and only the pot:
  # once the pot is cold the burn is done and the fan can stop, however hot the
  # chamber still is. The chamber PT100 stands in only when the thermocouple reads
  # invalid, so a dead probe cannot look like a cold pot and stop the fan early.
  - platform: template
    name: "Cooldown Temperature"
    id: cooldown_temp_f
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float pot = id(lit_sense_f).state;          // thermocouple beside the pot
      return isnan(pot) ? id(smoker_temp).state * 1.8f + 32.0f : pot;
    on_value:
      then:
        # Hot-start check: runs once, on the first valid (non-NAN) reading after boot.
        # on_boot fires before any sensor has published, so a check there always sees
        # NAN -- do it here instead. If we rebooted (power blip / OTA / crash) into a
        # hot smoker with the system off, get the fan running and start the cooldown
        # watchdog. x is already in F.
        - if:
            condition:
              lambda: "return !id(hot_start_checked) && !isnan(x);"
            then:
              - lambda: id(hot_start_checked) = true;
              - if:
                  condition:
                    and:
                      - switch.is_off: go
                      - lambda: "return x > ${fan_cooldown_temp_f};"
                  then:
                    - logger.log: "Hot startup - Fan ON"
                    - switch.turn_on: fan
                    - script.execute:
                        id: sc_set_state
                        new_state: ${st_cooldown}
                    - script.execute: sc_shutdown

  # Keeps the fire pot lit: modulates the igniter based on lit_sense_f.
  # Re-ignites below the lit point (lighting baseline + lit_rise_f), cuts the
  # igniter 25 F above it.
  - platform: template
    name: "Firepot Monitor"
    id: firepot_monitor
    update_interval: 10s
    lambda: |-
      // Relight band around the lit point (baseline at lighting + lit_rise_f), all in F:
      // re-ignite below it, cut the igniter 25 F above it.
      const float lit_f = id(lighting_start_temp_f) + id(lit_rise_f).state;
      const float sense_f = id(lit_sense_f).state;
      if (id(go).state && !isnan(sense_f)) {
        if (sense_f < lit_f) {
          if (!id(igniter).state) {
            id(igniter).turn_on();
          }
          return 1.0f;
        } else if (sense_f > lit_f + 25.0f) {
          id(igniter).turn_off();
          return 0.0f;
        }
      }
      return 0.0f;

  # Igniter current — ZMCT102 CT clamp (T1) on the igniter's AC line. Its burden
  # resistor (R10, 100Ω) feeds a differential input on the second ADS1115 (U6,
  # address 0x49) instead of an on-chip ADC pin, so ct_clamp samples this channel
  # directly (ADS1115Sensor implements VoltageSampler) rather than an adc sensor.
  - platform: ads1115
    id: igniter_current_raw
    ads1115_id: ads_hub_current
    multiplexer: A2_A3
    gain: 0.512
    sample_rate: 860
    internal: true

  # calibrate_linear assumes a 1000:1 CT ratio (ZMCT102's common spec) with the
  # 100Ω burden: V_rms = I_primary / 1000 * 100 = I_primary * 0.1. Re-derived from
  # measured current.
  - platform: ct_clamp
    sensor: igniter_current_raw
    name: "Igniter Current"
    id: igniter_current
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3   # ADS1115 at ±0.512 V: ~0.3 mA/LSB after calibration
    sample_duration: 1000ms
    update_interval: 5s
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 0.25 -> 4.9
    on_value:
      - lambda: |-
          // Only samples fully inside the on-window count: the straddling sample at
          // turn-on is skipped by igniter_settle_ms, and the one at turn-off arrives
          // after the relay has opened, so the state check below drops it.
          // NAN means the ADS1115 read failed, which says nothing about the element --
          // do not let a dead sensor look like a dead igniter. igniter_current_ok_ms
          // feeds the staleness check below.
          if (isnan(x)) return;
          id(igniter_current_ok_ms) = millis();
          if (!id(igniter).state) return;
          if (millis() - id(igniter_on_ms) < ${igniter_settle_ms}) return;
          bool healthy = x >= ${igniter_min_current};
          id(igniter_fault).publish_state(!healthy);
          if (!healthy) return;   // a faulted element must not drag the average down
          id(igniter_sum_a) += x;
          id(igniter_samples) += 1;

  # One value per light: the mean current while the igniter was on, published at
  # turn-off. Per-sample current scatters 5-8%, so a single reading says nothing about
  # element health; averaged over a ~5 minute light it is good to ~1.5%. Divide line
  # voltage by this in HA to trend the element's resistance (~76 ohm when sound).
  - platform: template
    name: "Igniter Mean Current"
    id: igniter_mean_current
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never   # published by igniter.on_turn_off

  # Rotary encoder — input-only pins, EXTERNAL pull-ups required (no internal)
  - platform: rotary_encoder
    name: "Encoder"
    id: encoder
    restore_mode: ALWAYS_ZERO
    publish_initial_value: true
    pin_a:
      number: ${pin_enc_a}
      mode:
        input: true
    pin_b:
      number: ${pin_enc_b}
      mode:
        input: true
    on_clockwise:
      - lambda: |-
          if (id(display_asleep)) {  // wake, swallow this event
            id(sc_wake).execute();
            return;
          }
          // grace window after wake: swallow extra detents from the same gesture
          if (millis() - id(wake_lockout_ms) < 500) return;
          id(last_activity_ms) = millis();
          // Step up to the next grid point: 5 F grid below the threshold, 25 F from it up.
          // Round off the C -> F conversion error so 225 F doesn't read as 224.99.
          float current_temp = roundf((id(smoker_pid).target_temperature * 1.8f + 32.0f) * 100.0f) / 100.0f;
          float step = (current_temp < ${set_temp_coarse_from}) ? 5.0f : 25.0f;
          float new_temp = floorf(current_temp / step) * step + step;
          if (new_temp <= ${set_temp_max_f}) {
            auto call = id(smoker_pid).make_call();
            call.set_target_temperature((new_temp - 32.0f) / 1.8f);
            call.perform();
          }
    on_anticlockwise:
      - lambda: |-
          if (id(display_asleep)) {  // wake, swallow this event
            id(sc_wake).execute();
            return;
          }
          // grace window after wake: swallow extra detents from the same gesture
          if (millis() - id(wake_lockout_ms) < 500) return;
          id(last_activity_ms) = millis();
          // Step down to the next grid point: 25 F grid above the threshold, 5 F at and below it.
          float current_temp = roundf((id(smoker_pid).target_temperature * 1.8f + 32.0f) * 100.0f) / 100.0f;
          float step = (current_temp > ${set_temp_coarse_from}) ? 25.0f : 5.0f;
          float new_temp = ceilf(current_temp / step) * step - step;
          if (new_temp >= ${set_temp_min_f}) {
            auto call = id(smoker_pid).make_call();
            call.set_target_temperature((new_temp - 32.0f) / 1.8f);
            call.perform();
          }

# ===================== Inputs =====================
binary_sensor:
  # Igniter commanded on but drawing no real current -- open element, failed relay or
  # a loose wire. delayed_on needs two consecutive bad samples, so one odd reading
  # cannot raise it. Reporting only; nothing acts on it yet.
  - platform: template
    name: "Igniter Fault"
    id: igniter_fault
    device_class: problem
    filters:
      - delayed_on: 12s

  # The current sense is the whole point of the igniter monitoring, so a sensor that
  # quietly stops reporting has to be visible. See the note on ads_hub_current.
  - platform: template
    name: "Igniter Current Stale"
    id: igniter_current_stale
    device_class: problem
    entity_category: diagnostic

  - platform: gpio
    name: "Encoder Button"
    id: encoder_button
    pin:
      number: ${pin_enc_sw}
      mode:
        input: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 1s
        then:
          - if:
              condition:
                lambda: 'return id(display_asleep);'
              then:
                - script.execute: sc_wake   # swallow: button just wakes
              else:
                - lambda: id(last_activity_ms) = millis();
                - logger.log: "Encoder short press - starting smoker"
                - switch.turn_on: go
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                lambda: 'return id(display_asleep);'
              then:
                - script.execute: sc_wake   # swallow: button just wakes
              else:
                - lambda: id(last_activity_ms) = millis();
                - logger.log: "Encoder long press - stopping smoker"
                - switch.turn_off: go

# ===================== Relays + LED =====================
switch:
  - platform: restart
    name: ${me} restart
  - platform: gpio
    name: "Fan"
    id: fan
    icon: mdi:fan
    pin: ${pin_relay2}
    restore_mode: ALWAYS_OFF
    # Hardware interlock: any attempt to turn the fan off while the chamber is
    # hot is overridden -- the fan runs until it cools. Deliberately publishes NO
    # status text; all state/status changes go through sc_set_state.
    on_turn_off:
      - if:
          condition:
            lambda: return !isnan(id(cooldown_temp_f).state) && id(cooldown_temp_f).state > ${fan_cooldown_temp_f};
          then:
            - logger.log: "Smoker is still hot, keeping fan on"
            - switch.turn_on: fan
            - script.execute: sc_shutdown
          else:
            - script.stop: sc_shutdown
            - if:
                condition:
                  lambda: return id(smoker_state) == ${st_cooldown};
                then:
                  - script.execute:
                      id: sc_set_state
                      new_state: ${st_off}
  - platform: gpio
    name: "Auger"
    id: auger
    icon: mdi:grain
    pin: ${pin_relay1}
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Igniter"
    id: igniter
    icon: mdi:heating-coil
    pin: ${pin_relay3}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(igniter_on_ms) = millis();
          id(igniter_sum_a) = 0.0f;
          id(igniter_samples) = 0;
          id(igniter_fault).publish_state(false);
    on_turn_off:
      - lambda: |-
          if (id(igniter_samples) > 0) {
            id(igniter_mean_current).publish_state(id(igniter_sum_a) / id(igniter_samples));
          } else {
            // Too short to sample, or every sample was faulted.
            id(igniter_mean_current).publish_state(NAN);
          }
          id(igniter_fault).publish_state(false);
  - platform: template
    name: "System ON⁄OFF"
    id: go
    optimistic: true
    on_turn_on:
      - logger.log: "System turned ON"
      # Template switch triggers fire even when already on -- ignore repeat
      # activations while a cook is active so the state machine can't regress.
      - if:
          condition:
            lambda: return id(smoker_state) != ${st_lighting} && id(smoker_state) != ${st_heating};
          then:
            - light.turn_on: display_backlight   # wake the display for remote (HA) starts
            - lambda: |-
                id(display_asleep) = false;
                id(last_activity_ms) = millis();
            - script.stop: sc_shutdown   # a fresh start cancels any cooldown fan watchdog
            - switch.turn_on: fan
            - script.execute:
                id: sc_set_state
                new_state: ${st_lighting}
            - script.execute: sc_light_pot
    on_turn_off:
      - logger.log: "System turned OFF"
      - script.execute: sc_stop_all_smoking
      - if:
          # SAFE is latched: leave the state (and "Safe Mode" text) alone.
          condition:
            lambda: return id(smoker_state) != ${st_safe};
          then:
            - if:
                condition:
                  lambda: return !isnan(id(cooldown_temp_f).state) && id(cooldown_temp_f).state > ${fan_cooldown_temp_f};
                then:
                  - script.execute:
                      id: sc_set_state
                      new_state: ${st_cooldown}
                else:
                  - script.execute:
                      id: sc_set_state
                      new_state: ${st_off}
      - switch.turn_off: fan   # interlock keeps it running if the fire pot is hot

# ===================== PID control =====================
# Gains for smoker_pid, adjustable from Home Assistant. They act on the error in
# degrees C and give a 0-1 output that heat_output scales to auger_feed_min..max.
# Starting values are the 2026-09-28 autotune at 225 F ("Some Overshoot PID": Ku
# 0.036, Pu 570 s), measured with feed max 0.80 and rescaled by 0.75 / 0.95 for 1.0.
number:
  - platform: template
    name: "PID Kp"
    id: pid_kp
    optimistic: true
    min_value: 0
    max_value: 10
    step: 0.0001
    restore_value: true
    initial_value: 0.0096
    mode: box
    icon: mdi:tune-vertical
    on_value:
      - lambda: id(smoker_pid).set_kp(x);

  - platform: template
    name: "PID Ki"
    id: pid_ki
    optimistic: true
    min_value: 0
    max_value: 1
    step: 0.000001
    restore_value: true
    initial_value: 0.000034
    mode: box
    icon: mdi:timer-sync
    on_value:
      - lambda: id(smoker_pid).set_ki(x);

  - platform: template
    name: "PID Kd"
    id: pid_kd
    optimistic: true
    min_value: 0
    max_value: 500
    step: 0.001
    restore_value: true
    initial_value: 1.82
    mode: box
    icon: mdi:timer-outline
    on_value:
      - lambda: id(smoker_pid).set_kd(x);

  # Fraction of each ${auger_cycle_s} s cycle the auger runs while heating.
  # Written by the PID through auger_feed_output; settable by hand for testing
  # with the climate OFF.
  - platform: template
    name: "Auger Feed Rate"
    id: auger_feed_rate
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    initial_value: 0.0
    optimistic: true
    restore_value: false
    mode: slider
    icon: mdi:grain

  - platform: template
    name: "Sleep Timeout"
    id: sleep_timeout
    min_value: 10
    max_value: 3600
    step: 10
    initial_value: 120
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    icon: mdi:sleep

  - platform: template
    name: "Firepot Lit Rise"
    id: lit_rise_f
    min_value: 10
    max_value: 400   # headroom: the pot thermocouple swings far more than the chamber did
    step: 5
    # 100 F suits the pot thermocouple: it crosses that ~2:45 into a light and sits
    # 120 F or more above baseline while heating, well clear of the +/-8 F of sun
    # drift. Deliberately NOT restored -- this threshold decides Safe Mode, so the
    # YAML stays the source of truth and a stale stored value can't quietly weaken it.
    initial_value: 100
    optimistic: true
    restore_value: false
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:fire

  - platform: template
    name: "Firepot Fail Timeout"
    id: firepot_fail_timeout
    min_value: 60
    max_value: 1800
    step: 30
    initial_value: 900
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    icon: mdi:fire-alert

# The autotuner measures the smoker's ultimate gain Ku and swing period Pu, then
# applies the Ziegler-Nichols gains. The rule chosen here is applied instead, from
# the same Ku and Pu (see the autotune interval below).
select:
  - platform: template
    name: "PID Autotune Rule"
    id: pid_autotune_rule
    optimistic: true
    restore_value: true
    # Order matters: the autotune interval indexes its factor table by position.
    options:
      - "Ziegler-Nichols PID"
      - "Pessen Integral PID"
      - "Some Overshoot PID"
      - "No Overshoot PID"
    initial_option: "Ziegler-Nichols PID"
    icon: mdi:tune-vertical

button:
  # Only runs while HEATING: the autotuner switches the auger between auger_feed_min
  # and auger_feed_max to swing the chamber around the setpoint. It needs several
  # swings -- expect an hour or more -- undisturbed by the lid or a setpoint change.
  - platform: template
    name: "PID Autotune"
    id: pid_autotune_button
    icon: mdi:auto-fix
    on_press:
      - if:
          condition:
            lambda: return id(smoker_state) == ${st_heating};
          then:
            - lambda: id(pid_autotune_active) = true;
            - climate.pid.autotune:
                id: smoker_pid
                noiseband: ${pid_autotune_noiseband}
                positive_output: ${pid_autotune_high_output}
                negative_output: 0.0
          else:
            - logger.log:
                level: WARN
                format: "PID autotune only runs while heating"

script:
  # Single writer for smoker_state AND status_msg. All state transitions go
  # through here; the status text is a pure function of state + display_asleep.
  # One-shot "flash" messages (e.g. "Pot Lit") may be published directly only
  # when a transition through here follows to overwrite them.
  - id: sc_set_state
    mode: single
    parameters:
      new_state: int
    then:
      - lambda: |-
          // The PID only drives the auger while heating. Its integral keeps running
          // while the climate is OFF, so clear it on the way into HEATING; a wake
          // re-sends the current state, which must not clear it mid-cook.
          if (new_state == ${st_heating} && id(smoker_state) != ${st_heating})
            id(smoker_pid).reset_integral_term();
          auto call = id(smoker_pid).make_call();
          call.set_mode(new_state == ${st_heating} ? climate::CLIMATE_MODE_HEAT : climate::CLIMATE_MODE_OFF);
          call.perform();

          id(smoker_state) = new_state;
          const char *msg = "Ready";
          switch (new_state) {
            case ${st_lighting}: msg = "Lighting Fire Pot"; break;
            case ${st_heating}:  msg = "Heating Mode"; break;
            case ${st_cooldown}: msg = "Cooling down"; break;
            case ${st_safe}:     msg = "Safe Mode"; break;
          }
          if (id(display_asleep)) msg = "Asleep";
          ESP_LOGI("state", "smoker_state -> %d (%s)", new_state, msg);
          id(status_msg).publish_state(msg);

  - id: sc_light_pot
    mode: single
    then:
      - logger.log: "sc_light_pot executing"
      - if:
          condition:
            - switch.is_on: go
          then:
            - delay: 0.01s   # prevents race conditions from occurring
            - logger.log: "Lighting fire pot now"
            - lambda: |-
                // Baseline for the rise-based lit check below.
                float f = id(lit_sense_f).state;
                id(lighting_start_temp_f) = isnan(f) ? 70.0f : f;
            - switch.turn_on: igniter
            - switch.turn_on: auger
            - delay: 90s # load up pellets

            # Feed the pot in 60 s cycles until it lights, up to 6 of them. Once
            # lit_sense_f has risen, the remaining iterations skip their body and
            # fall through immediately -- ESPHome has no loop break. Stopping as
            # soon as the fire is established avoids the overfeed that used to
            # push the chamber past the setpoint right after ignition.
            - switch.turn_off: auger
            - repeat:
                count: 6
                then:
                  - if:
                      condition:
                        lambda: |-
                          float f = id(lit_sense_f).state;
                          return isnan(f) || f < id(lighting_start_temp_f) + id(lit_rise_f).state;
                      then:
                        - logger.log:
                            format: "Keeping pot lit. Lighting cycle counter = %d"
                            args: ['iteration + 1']
                        - delay: 30s
                        - switch.turn_on: auger
                        - delay: 30s
                        - switch.turn_off: auger
            # done lighting -- only declare the pot lit if lit_sense_f actually climbed
            - if:
                condition:
                  lambda: |-
                    float f = id(lit_sense_f).state;
                    return !isnan(f) && f >= id(lighting_start_temp_f) + id(lit_rise_f).state;
                then:
                  # flash -- overwritten by the HEATING transition below
                  - lambda: id(status_msg).publish_state("Pot Lit");
                  - delay: 2s
                  - script.execute:
                      id: sc_set_state
                      new_state: ${st_heating}
                  - script.execute: sc_pot_heating
                  - delay: 300s
                  # hold the igniter on for 5 minutes after the pot is lit, then let it go
                  # (firepot_monitor may already have turned it off at the lit point + 25 F)
                  - switch.turn_off: igniter
                else:
                  - logger.log: "Lit sensor never rose to the lit threshold -> Safe Mode"
                  - script.execute: sc_enter_safe_mode

  - id: sc_pot_heating
    mode: restart
    then:
      - logger.log: "sc_pot_heating starting"
      - while:
          condition:
            - switch.is_on: go
          then:
            # Latch the rate for this cycle so the ON and OFF halves always sum to
            # one full cycle, even if the PID updates it mid-cycle.
            - lambda: |-
                float rate = id(auger_feed_rate).state;
                // No valid pit temperature -- fail safe: stop feeding pellets. The PID
                // would otherwise hold the feed at auger_feed_min.
                if (isnan(id(smoker_temp).state)) {
                  ESP_LOGW("auger", "smoker_temp is NaN, failing safe (auger off)");
                  rate = 0.0f;
                }
                id(auger_cycle_rate) = isnan(rate) ? 0.0f : std::clamp(rate, 0.0f, 1.0f);
            - logger.log:
                format: "Heating cycle: feed rate=%.2f"
                args: ["id(auger_cycle_rate)"]
            - if:
                condition:
                  lambda: "return id(auger_cycle_rate) > 0.0f;"
                then:
                  - switch.turn_on: auger
                  - delay: !lambda "return id(auger_cycle_rate) * ${auger_cycle_s} * 1000;"
            - switch.turn_off: auger
            - delay: !lambda "return (1.0f - id(auger_cycle_rate)) * ${auger_cycle_s} * 1000;"

  - id: sc_stop_all_smoking
    mode: single
    then:
      - logger.log: "sc_stop_all_smoking executing"
      - script.stop: sc_light_pot
      - script.stop: sc_pot_heating
      - switch.turn_off: igniter
      - switch.turn_off: auger

  # Firepot failed to light, or died during a cook. Latch the SAFE state and turn
  # the system off -- go.on_turn_off runs sc_stop_all_smoking (auger + igniter
  # off), leaves the state alone, and, via the fan interlock, keeps the fan
  # running until the chamber drops below fan_cooldown_temp_f.
  - id: sc_enter_safe_mode
    mode: single
    then:
      - logger.log: "ENTERING SAFE MODE: firepot fault"
      - script.execute:
          id: sc_set_state
          new_state: ${st_safe}
      - delay: 0.01s   # let the calling script unwind before go.on_turn_off stops it
      - switch.turn_off: go

  - id: sc_shutdown
    mode: restart
    then:
      - switch.turn_on: fan
      - delay: ${fan_cooldown_interval_s}s   # wait fan_cooldown_interval_s between re-checks
      - if:
          condition: # chamber is still hot
            lambda: |-
              float temp_f = id(cooldown_temp_f).state;   // pot thermocouple, already in F
              return !isnan(temp_f) && temp_f > ${fan_cooldown_temp_f};
          then:
            - logger.log: "Smoker is still hot, keeping fan on"
            - switch.turn_on: fan
            - script.execute: sc_shutdown
          else:
            - logger.log: "Smoker is now cool, turning off fan"
            - switch.turn_off: fan
            - script.stop: sc_shutdown

  # Blank the display backlight after inactivity. Relays and smoker_state are
  # untouched (the inactivity timer only fires when the smoker is already idle).
  - id: sc_sleep
    mode: single
    then:
      - logger.log: "sc_sleep: display off"
      - lambda: |-
          id(display_asleep) = true;
          id(status_msg).publish_state("Asleep");
      - light.turn_off: display_backlight

  # Wake from Asleep: restore the backlight, re-publish the current state's
  # status text, reset the idle timer.
  - id: sc_wake
    mode: single
    then:
      - logger.log: "sc_wake: display on"
      - light.turn_on: display_backlight
      - lambda: |-
          id(display_asleep) = false;
          id(last_activity_ms) = millis();
          id(wake_lockout_ms) = millis();
      - script.execute:
          id: sc_set_state
          new_state: !lambda "return id(smoker_state);"

# ===================== Sleep timer =====================
# Blank the display after `sleep_timeout` of no input, but only when fully idle
# (smoker off and not cooling down). Any touch / encoder input wakes it.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - lambda: 'return !id(display_asleep);'
              - switch.is_off: go
              - switch.is_off: fan
              - lambda: 'return (millis() - id(last_activity_ms)) > (uint32_t) (id(sleep_timeout).state * 1000.0f);'
          then:
            - script.execute: sc_sleep

  # Igniter current sense watchdog: flags a sensor that has stopped publishing valid
  # readings, whether or not the igniter is in use. ${igniter_stale_ms} of silence is
  # far longer than the 5 s update interval, so this only catches a real dropout.
  - interval: 60s
    then:
      - lambda: |-
          const uint32_t last_ok = id(igniter_current_ok_ms);
          // last_ok == 0 means it has never read: stale once past the grace window.
          bool stale = (millis() - last_ok) > ${igniter_stale_ms};
          if (stale && !id(igniter_current_stale).state) {
            ESP_LOGW("igniter", "No valid igniter current for %.0f s -- ADS1115 at 0x49 not reading",
                     (millis() - last_ok) / 1000.0f);
          }
          id(igniter_current_stale).publish_state(stale);

  # PID autotune result. The autotuner writes its gains straight into smoker_pid,
  # where a reboot would lose them. Work Ku and Pu back out of its Ziegler-Nichols
  # gains, apply the chosen rule, and store the result in the PID numbers (whose
  # on_value hands them back to smoker_pid).
  - interval: 10s
    then:
      - lambda: |-
          if (!id(pid_autotune_active))
            return;
          const float kp = id(smoker_pid).get_kp();
          const float ki = id(smoker_pid).get_ki();
          const float kd = id(smoker_pid).get_kd();
          if (kp == id(pid_kp).state && ki == id(pid_ki).state && kd == id(pid_kd).state)
            return;   // still running
          id(pid_autotune_active) = false;
          if (!(kp > 0.0f && ki > 0.0f)) {
            ESP_LOGW("autotune", "Unusable result kp=%.5f ki=%.6f, keeping the old gains", kp, ki);
            id(smoker_pid).set_kp(id(pid_kp).state);
            id(smoker_pid).set_ki(id(pid_ki).state);
            id(smoker_pid).set_kd(id(pid_kd).state);
            return;
          }
          // Ziegler-Nichols PID: kp = 0.6 Ku, ki = 1.2 Ku / Pu, kd = 0.075 Ku Pu
          const float ku = kp / 0.6f;
          const float pu = 1.2f * ku / ki;
          // {kp, ki, kd} factors, in pid_autotune_rule option order.
          static const float rules[][3] = {
              {0.6f, 1.2f, 0.075f},      // Ziegler-Nichols PID
              {0.7f, 1.75f, 0.105f},     // Pessen Integral PID
              {0.333f, 0.667f, 0.111f},  // Some Overshoot PID
              {0.2f, 0.4f, 0.0625f},     // No Overshoot PID
          };
          const size_t r = id(pid_autotune_rule).active_index().value_or(0);
          const float new_kp = rules[r][0] * ku;
          const float new_ki = rules[r][1] * ku / pu;
          const float new_kd = rules[r][2] * ku * pu;
          ESP_LOGI("autotune", "Ku=%.5f Pu=%.0f s, rule '%s': kp=%.5f ki=%.6f kd=%.4f", ku, pu,
                   id(pid_autotune_rule).option_at(r), new_kp, new_ki, new_kd);
          id(pid_kp).make_call().set_value(new_kp).perform();
          id(pid_ki).make_call().set_value(new_ki).perform();
          id(pid_kd).make_call().set_value(new_kd).perform();
          // The integral kept running under the old gains throughout the autotune.
          id(smoker_pid).reset_integral_term();

  # Firepot watchdog: while actively heating, if lit_sense_f stays below the lit
  # threshold longer than firepot_fail_timeout, drop into Safe Mode.
  - interval: 10s
    then:
      - lambda: |-
          // Only watch during an active heating cycle. Keyed on the state machine
          // (not the status text), so nothing outside sc_set_state can disarm it.
          if (id(smoker_state) != ${st_heating}) {
            id(pot_below_since_ms) = 0;
            return;
          }
          const float lit_f = id(lighting_start_temp_f) + id(lit_rise_f).state;
          float sense_f = id(lit_sense_f).state;
          if (!isnan(sense_f) && sense_f >= lit_f) {
            id(pot_below_since_ms) = 0;   // hot enough -- reset the fault timer
            return;
          }
          uint32_t now = millis();
          if (id(pot_below_since_ms) == 0) {
            id(pot_below_since_ms) = now;  // first sample below threshold
            return;
          }
          if (now - id(pot_below_since_ms) > (uint32_t) (id(firepot_fail_timeout).state * 1000.0f)) {
            ESP_LOGW("firepot", "Lit sensor below %.0f F for too long -> Safe Mode", lit_f);
            id(sc_enter_safe_mode).execute();
          }

