substitutions:
  me:   gate-ap-power

esphome:
  name: ${me}

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret esp_api_key

ota:
  - platform: esphome
    password: !secret esp_ota_pw
    id: my_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

prometheus:
    
web_server:
  version: 3

# https://github.com/KinDR007/VictronMPPT-ESPHOME
external_components:
  - source: github://KinDR007/VictronMPPT-ESPHOME@main

uart:
  id: victron_uart
  rx_pin: GPIO16
  baud_rate: 19200
  rx_buffer_size: 256

victron:
  id: victron0
  uart_id: victron_uart

sensor:
  - platform: uptime
    name: ${me} uptime
    update_interval: 120s

  - platform: wifi_signal
    name: wifi signal
    update_interval: 120s

  - platform: victron
    victron_id: victron0
    panel_voltage:
      name: "Panel voltage"
    battery_voltage:
      name: "Battery voltage"
    battery_current:
      name: "Battery current"
    error_code:
      name: "Error code"
    state_of_charge:
      name: "State of charge"
    panel_power:
      name: "Panel power"
    tracking_mode_id:
      name: "Tracking mode ID"

text_sensor:
  - platform: victron
    victron_id: victron0
    device_type:
      name: "device type"
    firmware_version_24bit:
      name: "firmware version"
    serial_number:
      name: "serial number"
    hardware_revision:
      name: "hardware number"
    error:
      name: "error"
    charging_mode:
      name: "charging mode"
