substitutions:
  me: tr1

esphome:
  name: ${me}
  comment: seeed xiao esp32c6

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret esp_api_key

ota:
  - platform: esphome
    encryption:
    id: my_ota

web_server:
  version: 3

network:
  enable_ipv6: true

openthread:
  device_type: FTD
  force_dataset: True
  output_power: 20dBm
  tlv: !secret thread_tlv

external_components:
  - source:
      type: local
      path: components
    components: [openthread_rssi]

# XIAO C6 RF switch: GPIO3 low powers it, GPIO14 low selects the onboard antenna
switch:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: rf_antenna_select
    pin: GPIO14
    restore_mode: ALWAYS_ON
    internal: true

openthread_rssi:
  update_interval: 15s

sensor:
  - platform: uptime
    name: uptime
    update_interval: 5s

text_sensor:
  - platform: openthread_info
    ip_address:
      name: "Thread IP Address"
    channel:
      name: "Thread Channel"
    role:
      name: "Thread Device Role"
